name: Monthly publications and bibliometry update

# Runs on the 2nd of each month (and on demand from the Actions tab).
#  1. Recomputes the bibliometry figures from data/publications.csv with
#     OpenAlex citation counts and publishes them directly (no review needed).
#  2. Looks for new publications in OpenAlex and, if any, opens a pull request
#     "New publications to review" — nothing is added to the site until it is merged.

on:
  schedule:
    - cron: "17 5 2 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update bibliometry figures
        run: |
          python tools/update_bibliometry.py
          python tools/build_publications.py
          python tools/build_french.py
          if ! git diff --quiet -- data/bibliometry.json; then
            git add -A
            git commit -m "Monthly bibliometry update (OpenAlex)"
            git push origin HEAD:main
            # pushes made with the workflow token do not start other workflows,
            # so ask the publishing workflow to run explicitly
            gh workflow run publish.yml --ref main
          else
            echo "Figures unchanged."
          fi

      - name: Look for new publications
        run: |
          git checkout -B new-publications
          python tools/find_new_publications.py --update-csv --csv /tmp/new.csv --markdown /tmp/pr.md
          n=$(($(wc -l < /tmp/new.csv) - 1))
          echo "candidates=$n"
          if [ "$n" -gt 0 ]; then tail -n +2 /tmp/new.csv >> data/publications.csv; fi
          if git diff --quiet -- data/publications.csv; then echo "Nothing new."; exit 0; fi
          python tools/build_publications.py
          python tools/build_french.py
          git add -A
          git commit -m "Publications found in OpenAlex (to review)"
          git push -f origin new-publications
          if gh pr view new-publications --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit new-publications --body-file /tmp/pr.md
          else
            gh pr create --base main --head new-publications \
              --title "New publications to review" --body-file /tmp/pr.md
          fi
