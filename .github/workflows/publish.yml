name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # While the site is being tested, keep search engines away.
  # Set to "false" on the day the domain is switched to this site.
  NOINDEX: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Build both languages
        run: python tools/build_site.py
      - name: Hide test site from search engines
        if: env.NOINDEX == 'true'
        run: |
          find _site -name "*.html" -exec sed -i 's|<head>|<head>\n<meta name="robots" content="noindex, nofollow">|' {} +
          printf 'User-agent: *\nDisallow:\n' > _site/robots.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
