# French sub-site. The .qmd files here are GENERATED by tools/build_french.py —
# do not edit them. This config file, however, is hand-maintained: it holds the
# French navigation labels.

project:
  type: website
  output-dir: ../_site/fr
  render:
    - "*.qmd"

lang: fr

website:
  title: "Nicolas Schtickzelle"
  description: "Nicolas Schtickzelle, Professeur d'Ecologie Quantitative et Biologie de la Conservation à l'UCLouvain."
  site-url: https://www.nicolas-schtickzelle.net/fr
  favicon: ../assets/img/logo.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image

  navbar:
    logo: ../assets/img/logo.png
    logo-alt: "Nicolas Schtickzelle"
    title: false
    pinned: true
    left:
      - href: index.qmd
        text: Accueil
      - href: short-bio.qmd
        text: Bio en bref
      - href: research-interests.qmd
        text: Recherche
      - href: publications.qmd
        text: Publications
      - href: mentoring.qmd
        text: Mentorat
      - href: teaching.qmd
        text: Enseignement
      - href: outreach.qmd
        text: Vulgarisation
      - href: contact.qmd
        text: Contact
    right:
      - text: "EN"
        href: ../index.html
        aria-label: "English version"
      - icon: google
        href: https://scholar.google.be/citations?user=LH4kk5YAAAAJ&hl=fr
        aria-label: Google Scholar
      - icon: linkedin
        href: https://www.linkedin.com/in/nicolas-schtickzelle-b64834b3/
        aria-label: LinkedIn
      - icon: envelope
        href: "#email"
        aria-label: Email

  page-footer:
    left: "&copy; 2017–2026 Nicolas Schtickzelle"
    center: "Quantitative Conservation Biology &middot; Earth and Life Institute &middot; UCLouvain"
    right:
      - href: contact.qmd
        text: Contact

format:
  html:
    theme:
      - cosmo
      - styles.scss
    toc: false
    anchor-sections: false
    smooth-scroll: true
    link-external-newwindow: true
    include-after-body:
      - _includes/email.html
      - _includes/analytics.html
    grid:
      body-width: 1000px
